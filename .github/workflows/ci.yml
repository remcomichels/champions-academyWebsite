name: CI

# Runs on every push to main and on every pull request, so broken lint or types
# are caught automatically before they're merged.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 24, not 22, because the lockfile is written by npm 11 and Node 22 ships
      # npm 10. The two disagree about which transitive entries belong in the
      # tree — npm 10 rejects an npm 11 lockfile as out of sync, naming packages
      # that are present — so `npm ci` failed here while passing locally.
      #
      # Matching CI to the version the lockfile is generated with is the fix;
      # regenerating the lockfile under npm 10 only moves the disagreement to
      # whoever next runs `npm install`.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # `npm ci` runs the postinstall (`nuxt prepare`), which generates the
      # .nuxt types + eslint config that lint and typecheck depend on.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      # Optional — uncomment to also verify a production build compiles.
      # Add any build-time env as repo secrets first.
      # - name: Build
      #   run: npm run build
